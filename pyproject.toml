[project]
name = "zpgso-graphics-project"
version = "0.1.0"
description = "A 3D graphics renderer implemented in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[project.scripts]
zpgso-graphics-project = "zpgso_graphics_project:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
